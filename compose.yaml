services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: youthmenu
      POSTGRES_DB: youthmenu
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youthmenu -d youthmenu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
